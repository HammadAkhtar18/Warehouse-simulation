# ML-Agents Training Configuration for Warehouse Robot Simulation
#
# HOW TO TRAIN:
#   1. Activate venv: ml-agents-env\Scripts\activate
#   2. Run: mlagents-learn Assets/ML-Agents/config.yaml --run-id=warehouse_v1
#   3. Press Play in Unity Editor when prompted
#   4. Monitor progress via TensorBoard: tensorboard --logdir results

behaviors:
  RobotAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 500000
    time_horizon: 1024
    summary_freq: 5000
    threaded: true
